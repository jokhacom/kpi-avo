<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unoom KPI</title>
<link rel="icon" href="../icons/favicon-32.png" type="image/png" />
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kpi-core.js"></script>
<style>
  :root { --bg: #f6f8fc; --card: #fff; --text: #061331; --muted: #5b6b86; --border: #dfe5ef; --primary: #1a56ff; --on-primary: #fff; --red: #c62828; --green: #1b8a4b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header img { width: 32px; height: 32px; }
  header b { font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--primary); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--primary); color: var(--on-primary); }
  button.ghost { background: transparent; color: var(--primary); }
  button.link { border: none; background: none; color: var(--muted); font-weight: 400; padding: 4px; margin-top: 4px; }
  button:disabled { opacity: .6; cursor: default; }
  .muted { color: var(--muted); font-size: 12px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; white-space: pre-line; }
  .ok { color: var(--green); font-size: 13px; margin-top: 8px; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <img src="../icons/icon-192.png" alt="" />
  <div><b>Unoom KPI</b><div class="muted">Расчёт KPI прямо в Excel</div></div>
</header>

<!-- Вход: те же логин и пароль, что на сайте -->
<section id="login" class="card hidden">
  <div>Войдите, чтобы взять ваши настройки KPI с сайта.</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" />
  <label for="password">Пароль</label>
  <input id="password" type="password" autocomplete="current-password" />
  <button id="btnLogin" class="primary">Войти</button>
  <button id="btnGuest" class="ghost">Продолжить как гость</button>
  <div id="loginErr" class="err"></div>
</section>

<section id="main" class="hidden">
  <div class="card">
    <div id="who" class="muted"></div>
    <div id="settingsInfo" style="margin-top:6px"></div>
    <button id="btnLogout" class="link">Выйти</button>
  </div>
  <div class="card">
    <div>Откройте лист с данными: в столбце A имена сотрудников, в первой строке названия показателей (как на сайте) и, по желанию, столбец «Часы».</div>
    <button id="btnCalc" class="primary">Рассчитать</button>
    <div id="calcErr" class="err"></div>
    <div id="calcOk" class="ok"></div>
    <div id="calcWarn" class="muted"></div>
  </div>
</section>

<div id="boot" class="muted">Загрузка…</div>
<script src="kpi-excel.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
